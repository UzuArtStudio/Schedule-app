<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- ★これ絶対必要 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<link rel="icon" href="https://uzuartstudio.github.io/Schedule-app/icon.png">
<link rel="apple-touch-icon" href="https://uzuartstudio.github.io/Schedule-app/icon.png">

<title>うず絵画教室｜出欠</title>

<style>

html {
  font-size: 16px;
}

body {
  font-family: sans-serif;
  margin: 0;
  background: #f7f7f7;
  display: flex;
  justify-content: center;
}

/* 全体 */
.container {
  max-width: 600px;
  width: 100%;
  margin-left: auto;
  margin-right: auto;
  padding: 16px;
}

/* タイトル */
h2 {
  text-align: center;
}

/* 入力欄 */
input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

textarea {
  width: 100%;
  min-height: 90px;
  padding: 12px;
  margin-bottom: 10px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
  resize: vertical;
  font-family: sans-serif;
}

/* 日付ブロック */
.date-card {
  background: white;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
}

/* ボタン */
.btn-group {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

button {
  flex: 1;
  padding: 12px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
  background: white;
  font-weight: bold;
}

/* 月見出し */
h3 {
  margin-top: 20px;
  font-size: 16px;
  color: #666;
}

/* =======================
   出欠ボタン
   ======================= */

.btn-group button {
  position: relative;
  background: white;
  border: 2px solid #ddd;
  color: transparent;
  height: 52px;
  transition: 0.2s;
}

/* ○ */
.btn-group button:nth-child(1)::after {
  content: "";
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 3px solid #4DA6FF;
  position: absolute;
  inset: 0;
  margin: auto;
}

/* △ */
.btn-group button:nth-child(2)::after {
  content: "";
  width: 0;
  height: 0;
  border-left: 11px solid transparent;
  border-right: 11px solid transparent;
  border-bottom: 20px solid #FFD95A;
  position: absolute;
  inset: 0;
  margin: auto;
}

/* × */
.btn-group button:nth-child(3)::before,
.btn-group button:nth-child(3)::after {
  content: "";
  width: 24px;
  height: 3px;
  background: #FFB347;
  position: absolute;
  inset: 0;
  margin: auto;
  border-radius: 999px;
}

.btn-group button:nth-child(3)::before {
  transform: rotate(45deg);
}

.btn-group button:nth-child(3)::after {
  transform: rotate(-45deg);
}

/* 選択状態 */
.btn-group button.selected {
  background: #f3f9ff;
  border-color: #4DA6FF;
  transform: scale(1.03);
}

/* =======================
   参加予定人数
   ======================= */

.attendance-info {
  margin-top: 4px;
  margin-bottom: 8px;
  font-size: 13px;
  color: #666;
  line-height: 1.4;
}

/* =======================
   補足説明
   ======================= */

.sub-note {
  font-size: 13px;
  color: #888;
  margin-top: -6px;
  margin-bottom: 16px;
  line-height: 1.5;
}

/* =======================
   時間選択
   ======================= */

.time-area {
  display: none;
  margin-top: 10px;
}

.time-title {
  font-size: 14px;
  color: #666;
  margin-bottom: 6px;
}

.time-group {
  display: flex;
  gap: 8px;
}

/*
   時間ボタンは○△×とは別デザイン
*/
.time-btn {
  flex: 1;
  padding: 10px 4px;
  font-size: 14px;
  height: auto !important;
  color: #333 !important;
  border: 1px solid #ccc !important;
  background: white !important;
  position: static !important;
  transform: none !important;
}

.time-btn.selected {
  background: #f3f9ff !important;
  border: 2px solid #4DA6FF !important;
  color: #333 !important;
}

.time-count {
  display: block;
  font-size: 11px;
  color: #777;
  margin-top: 2px;
}

.time-note {
  margin-top: 6px;
  font-size: 12px;
  color: #777;
}

/* =======================
   送信ボタン
   ======================= */

.submit-btn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  font-size: 18px;
  background: #4DA6FF;
  color: white;
  border: none;
  border-radius: 10px;
}

/* =======================
   ローディング
   ======================= */

#loading {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #ddd;
  border-top: 4px solid #4DA6FF;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

</style>
</head>

<body>

<div id="loading">
  <div class="spinner"></div>
  <p>読み込み中...</p>
</div>

<div class="container">

<h2>うず絵画教室 出欠</h2>

<input id="name" placeholder="お名前">

<input id="email" placeholder="メール（任意）">

<p class="sub-note">
入力内容の確認メールをお送りします
</p>

<div id="dates"></div>

<label for="note">その他追記</label>

<textarea
  id="note"
  placeholder="来室時間（例：16:30）や連絡事項など"
></textarea>

<p class="sub-note">
※レッスン当日12:00以降の変更は、
出欠フォームではなく直接ご連絡をお願いいたします。
</p>

<button class="submit-btn" onclick="submitData()">送信</button>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzoRsQefR7uDn16YwJ6OqQnfuD4Flt8-mQ0nqT97aaTiM_h5ew532DGI01sxMxCdbE/exec";


let dates = [];
let answers = [];
let times = [];

let lessons = {};
let availableTimes = {};
let timeCounts = {};


// =======================
// 参加人数によるDAY表示
// =======================

function getDayMessage(count) {

  if (count === 0) {
    return "🌱 参加予定募集中";
  }

  if (count === 1) {
    return "🎨 先生独り占めDAY";
  }

  if (count === 2) {
    return "✏️ じっくり制作DAY";
  }

  if (count === 3) {
    return "🙌 わいわい制作DAY";
  }

  return "🌈 にぎやかアトリエDAY";
}


// =======================
// 保存
// =======================

function saveData() {

  localStorage.setItem(
    "formData",
    JSON.stringify({

      name:
        document.getElementById("name").value,

      email:
        document.getElementById("email").value,

      note:
        document.getElementById("note").value,

      answers:
        answers,

      times:
        times

    })
  );
}


// =======================
// 復元
// =======================

function loadData() {

  const saved =
    localStorage.getItem("formData");

  if (!saved) {
    return null;
  }

  try {

    return JSON.parse(saved);

  } catch (e) {

    console.error(e);

    return null;

  }
}


const savedData = loadData();


// =======================
// データ取得
// =======================

fetch(API_URL)

.then(res => res.json())

.then(data => {

  const box =
    document.getElementById("dates");

  let currentMonth = "";

  // GASから受け取ったデータ
  lessons =
    data.lessons || {};

  availableTimes =
    data.availableTimes || {};

  timeCounts =
    data.timeCounts || {};


  data.dates.forEach(d => {

    const display =
      String(d);

    const count =
      data.counts?.[display] || 0;

    const lesson =
      data.lessons?.[display] || "";

    const [m] =
      display.split("/").map(Number);


    // =======================
    // 月見出し
    // =======================

    if (currentMonth !== m) {

      currentMonth = m;

      const h =
        document.createElement("h3");

      h.textContent =
        m + "月";

      box.appendChild(h);

    }


    // =======================
    // データ保存
    // =======================

    const i =
      dates.length;

    dates.push(display);


    const savedAnswer =
      savedData?.answers?.[i] || "";

    const savedTime =
      savedData?.times?.[i] || "";

    answers.push(savedAnswer);

    times.push(savedTime);


    // =======================
    // 日付カード
    // =======================

    const div =
      document.createElement("div");

    div.className =
      "date-card";


    div.innerHTML = `

      <div>
        <strong>${display}</strong>
        ${lesson ? "　" + lesson : ""}
      </div>

      <div class="attendance-info">
        参加予定：${count}名　|　${getDayMessage(count)}
      </div>

      <div class="btn-group">

        <button
          onclick="setAns(${i},'○',this)"
        >
          ○
        </button>

        <button
          onclick="setAns(${i},'△',this)"
        >
          △
        </button>

        <button
          onclick="setAns(${i},'×',this)"
        >
          ×
        </button>

      </div>

      <div
        id="time-area-${i}"
        class="time-area"
      >
      </div>

    `;


    box.appendChild(div);


    // =======================
    // 出欠状態の復元
    // =======================

    if (savedAnswer) {

      div
        .querySelectorAll(".btn-group button")
        .forEach(b => {

          if (
            b.textContent.trim()
            === savedAnswer
          ) {

            b.classList.add("selected");

          }

        });

    }


    // =======================
    // ○なら時間も復元
    // =======================

    if (
      savedAnswer === "○" &&
      availableTimes[display] &&
      availableTimes[display].length > 0
    ) {

      showTimeArea(i);

    }

  });


  // =======================
  // 名前・メール・追記復元
  // =======================

  if (savedData) {

    document.getElementById("name").value =
      savedData.name || "";

    document.getElementById("email").value =
      savedData.email || "";

    document.getElementById("note").value =
      savedData.note || "";

  }


  // =======================
  // 入力変更で保存
  // =======================

  document
    .getElementById("name")
    .addEventListener("input", saveData);

  document
    .getElementById("email")
    .addEventListener("input", saveData);

  document
    .getElementById("note")
    .addEventListener("input", saveData);


  // =======================
  // ローディング終了
  // =======================

  document
    .getElementById("loading")
    .style.display = "none";

})

.catch(err => {

  document
    .getElementById("loading")
    .style.display = "none";

  alert(
    "読み込みに失敗しました。"
  );

  console.error(err);

});


// =======================
// 出欠セット
// =======================

function setAns(i, val, btn) {

  answers[i] = val;


  // 選択状態
  btn.parentNode
    .querySelectorAll("button")
    .forEach(b =>
      b.classList.remove("selected")
    );

  btn.classList.add("selected");


  const area =
    document.getElementById(
      `time-area-${i}`
    );


  // =======================
  // ○の場合だけ時間を表示
  // =======================

  if (val === "○") {

    showTimeArea(i);

  } else {

    area.style.display =
      "none";

    times[i] = "";

  }


  saveData();

}


// =======================
// 時間選択表示
// =======================

function showTimeArea(i) {

  const area =
    document.getElementById(
      `time-area-${i}`
    );

  const date =
    dates[i];

  const list =
    availableTimes[date] || [];


  // 時間設定がない場合
  if (list.length === 0) {

    area.style.display =
      "none";

    return;

  }


  let html = `

    <div class="time-title">
      来校予定時間（目安）
    </div>

    <div class="time-group">

  `;


  list.forEach(time => {

    const count =
      (
        timeCounts[date] &&
        timeCounts[date][time]
      ) || 0;


    const selected =
      times[i] === time
      ? "selected"
      : "";


    html += `

      <button
        type="button"
        class="time-btn ${selected}"
        onclick="setTime(${i}, '${time}', this)"
      >

        ${time}

        <span class="time-count">
          現在 ${count}人
        </span>

      </button>

    `;

  });


  html += `

    </div>

    <div class="time-note">
      ※来校時間は目安です
    </div>

  `;


  area.innerHTML =
    html;

  area.style.display =
    "block";

}


// =======================
// 時間選択
// =======================

function setTime(i, time, btn) {

  times[i] = time;


  btn.parentNode
    .querySelectorAll(".time-btn")
    .forEach(b =>
      b.classList.remove("selected")
    );


  btn.classList.add("selected");


  saveData();

}


// =======================
// 送信
// =======================

function submitData() {

  const name =
    document
      .getElementById("name")
      .value
      .trim();

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const note =
    document
      .getElementById("note")
      .value
      .trim();


  // =======================
  // 名前チェック
  // =======================

  if (!name) {

    alert(
      "名前を入力してください"
    );

    return;

  }


  // =======================
  // 出欠チェック
  // =======================

  const hasAnswer =
    answers.some(
      a => a !== ""
    );


  if (!hasAnswer) {

    alert(
      "１つ以上選択してください"
    );

    return;

  }


  // =======================
  // 時間チェック
  // =======================

  for (
    let i = 0;
    i < dates.length;
    i++
  ) {

    if (

      answers[i] === "○" &&

      availableTimes[dates[i]] &&

      availableTimes[dates[i]].length > 0 &&

      !times[i]

    ) {

      alert(
        `${dates[i]}の来校予定時間を選択してください`
      );

      return;

    }

  }


  // =======================
  // 送信中
  // =======================

  document
    .querySelector("#loading p")
    .textContent = "送信中...";


  document
    .getElementById("loading")
    .style.display = "flex";


  fetch(API_URL, {

    method: "POST",

    body: JSON.stringify({

      name,
      email,
      note,
      dates,
      answers,
      times

    })

  })

  .then(r => r.json())

  .then(res => {

    document
      .getElementById("loading")
      .style.display = "none";


    if (res.ok) {

      document.body.innerHTML = `

        <div style="
          text-align:center;
          margin-top:50px;
        ">

          <h2>
            入力ありがとうございました
          </h2>

          <p>
            出欠を受け付けました。
          </p>

          <button
            onclick="location.reload()"
            style="
              margin-top:20px;
              padding:12px 20px;
              font-size:16px;
            "
          >
            もう一度入力する
          </button>

        </div>

      `;

    } else {

      alert(
        "エラー：" + res.error
      );

    }

  })

  .catch(err => {

    document
      .getElementById("loading")
      .style.display = "none";

    console.error(err);

    alert(
      "送信に失敗しました。もう一度お試しください。"
    );

  });

}

</script>

</body>
</html>
