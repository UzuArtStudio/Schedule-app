<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
html {
  font-size: 16px;
}

body {
  font-family: sans-serif;
  margin: 0;
  background: #f7f7f7;
  display: flex;
  justify-content: center;
}

/* 全体 */
.container {
  max-width: 500px;
  width: 100%;
  margin-left: auto;
  margin-right: auto;
  padding: 16px;
  box-sizing: border-box;
}

/* タイトル */
h2 {
  text-align: center;
}

/* 入力欄 */
input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

/* 月見出し */
h3 {
  margin-top: 20px;
  font-size: 16px;
  color: #666;
}

/* 日付ブロック */
.date-card {
  background: white;
  padding: 14px;
  margin-bottom: 10px;
  border-radius: 10px;
}

/* 日付 */
.date-title {
  font-weight: bold;
  font-size: 17px;
}

/* レッスン内容 */
.lesson {
  margin-top: 6px;
  font-size: 14px;
  color: #555;
  line-height: 1.5;
}

/* 出欠ボタン */
.btn-group {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

button {
  flex: 1;
  padding: 12px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
  background: white;
}

.selected {
  background: #333;
  color: white;
}

/* 時間エリア */
.time-area {
  display: none;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid #eee;
}

/* 時間タイトル */
.time-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

/* 時間ボタン */
.time-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.time-btn {
  flex: 0 0 calc(33.333% - 6px);
  box-sizing: border-box;
  font-size: 15px;
  padding: 10px 4px;
}

/* 時間人数 */
.time-count {
  display: block;
  font-size: 12px;
  color: #666;
  margin-top: 3px;
}

/* 注意書き */
.time-note {
  margin-top: 8px;
  font-size: 12px;
  color: #777;
  line-height: 1.5;
}

/* 送信ボタン */
.submit-btn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  font-size: 18px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 10px;
}

/* ローディング */
#loading {
  position: fixed;
  inset: 0;
  background: white;
  display:flex;
  flex-direction: column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.spinner {
  width:40px;
  height:40px;
  border:4px solid #ddd;
  border-top:4px solid #333;
  border-radius:50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
</style>
</head>

<body>

<div id="loading">
  <div class="spinner"></div>
  <p>読み込み中...</p>
</div>

<div class="container">

<h2>うず絵画教室 出欠</h2>

<input id="name" placeholder="お名前">

<input id="email" placeholder="メール（任意）">

<p style="font-size:14px; color:#666;">
入力内容の確認メールをお送りします
</p>

<div id="dates"></div>

<button class="submit-btn" onclick="submitData()">送信</button>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzPtltsTn_V23gmfHAiUEjG4IHGfupg1YZnrdEXvLnbf0UuhSIRo61BDWSgRI2o7HZccA/exec";

let dates = [];
let answers = [];
let times = [];

let availableTimes = {};
let timeCounts = {};


// =======================
// データ取得
// =======================

fetch(API_URL)
.then(res => res.json())
.then(data => {

  const box = document.getElementById("dates");

  let currentMonth = "";

  availableTimes = data.availableTimes || {};
  timeCounts = data.timeCounts || {};

  data.dates.forEach(d => {

    const display = String(d);

    const [m, day] =
      display.split("/").map(Number);

    // 月見出し
    if(currentMonth !== m){

      currentMonth = m;

      const h = document.createElement("h3");

      h.textContent = m + "月";

      box.appendChild(h);
    }

    const i = dates.length;

    dates.push(display);

    answers.push("");

    times.push("");


    // =======================
    // 日付カード
    // =======================

    const div = document.createElement("div");

    div.className = "date-card";


    // レッスン内容
    const lesson =
      data.lessons[display] || "";


    div.innerHTML = `

      <div class="date-title">
        ${display}
      </div>

      ${
        lesson
        ? `<div class="lesson">${lesson}</div>`
        : ""
      }

      <div class="btn-group">

        <button
          onclick="setAns(${i},'○',this)">
          ○
        </button>

        <button
          onclick="setAns(${i},'△',this)">
          △
        </button>

        <button
          onclick="setAns(${i},'×',this)">
          ×
        </button>

      </div>

      <div
        id="time-area-${i}"
        class="time-area">
      </div>

    `;

    box.appendChild(div);

  });


  document.getElementById("loading").style.display = "none";

})
.catch(err => {

  console.error(err);

  document.querySelector("#loading p")
    .textContent =
    "読み込みに失敗しました。ページを再読み込みしてください。";

});


// =======================
// 出欠選択
// =======================

function setAns(i, val, btn){

  answers[i] = val;


  // ボタンの選択状態
  btn.parentNode
    .querySelectorAll("button")
    .forEach(b =>
      b.classList.remove("selected")
    );

  btn.classList.add("selected");


  const area =
    document.getElementById(`time-area-${i}`);


  // ○の場合だけ時間選択
  if(val === "○"){

    showTimeArea(i);

  }else{

    area.style.display = "none";

    times[i] = "";

  }

}


// =======================
// 時間選択表示
// =======================

function showTimeArea(i){

  const area =
    document.getElementById(`time-area-${i}`);

  const date =
    dates[i];

  const list =
    availableTimes[date] || [];


  if(list.length === 0){

    area.style.display = "none";

    return;

  }


  let html = `

    <div class="time-title">
      来校予定時間（目安）
    </div>

    <div class="time-group">
  `;


  list.forEach(time => {

    const count =
      (timeCounts[date] &&
       timeCounts[date][time])
      || 0;


    const selected =
      times[i] === time
      ? "selected"
      : "";


    html += `

      <button
        class="time-btn ${selected}"
        onclick="setTime(${i}, '${time}', this)">

        ${time}

        <span class="time-count">
          現在 ${count}人
        </span>

      </button>

    `;

  });


  html += `

    </div>

    <div class="time-note">
      ※来校時間は目安です。<br>
      混雑状況などにより、多少前後する場合があります。
    </div>

  `;


  area.innerHTML = html;

  area.style.display = "block";

}


// =======================
// 時間選択
// =======================

function setTime(i, time, btn){

  times[i] = time;


  btn.parentNode
    .querySelectorAll(".time-btn")
    .forEach(b =>
      b.classList.remove("selected")
    );

  btn.classList.add("selected");

}


// =======================
// 送信
// =======================

function submitData(){

  const name =
    document.getElementById("name")
      .value.trim();

  const email =
    document.getElementById("email")
      .value.trim();


  if(!name){

    alert("名前を入力してください");

    return;

  }


  const hasAnswer =
    answers.some(a => a !== "");


  if(!hasAnswer){

    alert("１つ以上選択してください");

    return;

  }


  // ○なのに時間未選択がないか確認
  for(let i = 0; i < dates.length; i++){

    if(
      answers[i] === "○" &&
      availableTimes[dates[i]] &&
      availableTimes[dates[i]].length > 0 &&
      !times[i]
    ){

      alert(
        `${dates[i]}の来校予定時間を選択してください`
      );

      return;

    }

  }


  document.querySelector("#loading p")
    .textContent = "送信中...";

  document.getElementById("loading")
    .style.display = "flex";


  fetch(API_URL, {

    method:"POST",

    body:JSON.stringify({

      name,
      email,
      dates,
      answers,
      times

    })

  })

  .then(r => r.json())

  .then(res => {

    document.getElementById("loading")
      .style.display = "none";


    if(res.ok){

      document.body.innerHTML = `

        <div style="
          text-align:center;
          margin-top:50px;
          padding:20px;
        ">

          <h2>
            入力ありがとうございました
          </h2>

          <p>
            出欠を受け付けました。
          </p>

          <button
            onclick="location.reload()"
            style="
              margin-top:20px;
              padding:12px 20px;
              font-size:16px;
            "
          >
            もう一度入力する
          </button>

        </div>

      `;

    }else{

      alert(
        "エラー："+res.error
      );

    }

  })

  .catch(err => {

    document.getElementById("loading")
      .style.display = "none";

    console.error(err);

    alert(
      "送信に失敗しました。もう一度お試しください。"
    );

  });

}

</script>

</body>
</html>
